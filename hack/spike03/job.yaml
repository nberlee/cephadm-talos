# Spike (plan 03, step 0): a never job claims its id, writes a started record and an
# atomic result file, and exits; Talos reports completed/failed with the exit code.
apiVersion: v1alpha1
kind: ContainerConfig
name: x-job-ok
image: docker.io/library/alpine:3.23
entrypoint: [/bin/sh, -c, 'd=/vol/jobs/op-1; mkdir /vol/jobs 2>/dev/null; mkdir $d || { echo "claimed before"; cat $d/result 2>/dev/null; exit 0; }; echo started > $d/started && sync $d/started; echo "osd_id=7" > $d/.result && sync $d/.result && mv $d/.result $d/result && sync $d; echo done']
mounts:
  - volume: {name: x-records, destination: /vol}
restart: {policy: never}
---
apiVersion: v1alpha1
kind: ContainerConfig
name: x-job-fail
image: docker.io/library/alpine:3.23
entrypoint: [/bin/sh, -c, 'echo failing >&2; exit 3']
restart: {policy: never}

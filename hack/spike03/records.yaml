# Spike (plan 03, step 0): can a restricted init container with only CHOWN and FOWNER
# prepare a uid-50 records directory on a user volume, and does a uid-50 writer
# that depends on it with condition: succeeded work across a reboot?
apiVersion: v1alpha1
kind: UserVolumeConfig
name: x-records
volumeType: directory
---
apiVersion: v1alpha1
kind: ContainerConfig
name: x-records-init
image: docker.io/library/alpine:3.23
entrypoint: [/bin/sh, -c, 'mkdir -p /vol/records && chown 50:50 /vol/records && chmod 0700 /vol/records && ls -ldn /vol /vol/records']
mounts:
  - volume: {name: x-records, destination: /vol}
security:
  profile: restricted
  capabilities: {add: [CHOWN, FOWNER]}
restart: {policy: on-failure, maxRetries: 3}
---
apiVersion: v1alpha1
kind: ContainerConfig
name: x-recagent
image: docker.io/library/alpine:3.23
entrypoint: [/bin/sh, -c, 'cd /vol/records && n=$(date +%s) && echo "boot $n" > .w.tmp && sync .w.tmp && mv .w.tmp w-$n && sync . && ls -ln && trap "exit 0" TERM && while :; do sleep 1; done']
runAs: {uid: 50, gid: 50}
mounts:
  - volume: {name: x-records, destination: /vol}
security: {profile: restricted}
dependsOn:
  containers:
    - {name: x-records-init, condition: succeeded}

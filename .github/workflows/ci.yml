name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  capabilities:
    runs-on: ubuntu-latest
    env:
      # Ceph v21.2.0 has no git tag: the commit is the release image's CEPH_SHA1 label
      CEPH_COMMIT: b060042deb05d33e6cc358970cfb8221240bcf3e
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the Ceph sources the matrix is checked against
        run: |
          git init --quiet ceph && cd ceph
          git sparse-checkout set src/pybind/mgr/orchestrator src/pybind/mgr/cephadm src/python-common/ceph/deployment
          git fetch --quiet --depth 1 --filter=blob:none https://github.com/ceph/ceph.git "$CEPH_COMMIT"
          git checkout --quiet FETCH_HEAD
      - run: python3 -I hack/capabilities.py ceph docs/capabilities.md

  mgrmodule:
    runs-on: ubuntu-latest
    env:
      CEPH_COMMIT: b060042deb05d33e6cc358970cfb8221240bcf3e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install prettytable pyyaml cryptography
      - name: Fetch the Ceph mgr sources the module is tested against
        run: |
          git init --quiet ceph && cd ceph
          git sparse-checkout set src/pybind src/python-common
          git fetch --quiet --depth 1 --filter=blob:none https://github.com/ceph/ceph.git "$CEPH_COMMIT"
          git checkout --quiet FETCH_HEAD
      - run: hack/mgrmodule-test.sh ceph
